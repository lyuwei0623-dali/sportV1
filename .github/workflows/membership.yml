name: Membership isolated database tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  membership-db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: members_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - run: python -m unittest discover -s tests -p 'test_membership_postgres.py' -v
        env:
          MEMBERS_TEST_DSN: postgresql://postgres:local-test-only@127.0.0.1:5432/members_test
